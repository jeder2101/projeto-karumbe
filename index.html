<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Karumbé - Dicionário Guarani Nhandewa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <img src="assets/tartaruga.png" alt="Projeto Karumbé" class="logo-tartaruga">
        </div>
        <h1>PROJETO KARUMBÉ</h1>
        <h2>📖 Dicionário Guarani Nhandewa</h2>
        
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Busca Inteligente (Levenshtein)">
        </div>
    </header>

    <main class="main-content">
        <!-- Grid de Categorias em Blocos Largos -->
        <div class="categorias-grid">
            <a href="#" class="cat-card verbos">
                <div class="card-img"><img src="assets/verbo.png" alt="Verbos"></div>
                <div class="card-text">
                    <span class="card-title">Verbos</span>
                    <span class="card-sub">Adjapo</span>
                </div>
            </a>

            <a href="#" class="cat-card expressoes">
                <div class="card-img"><img src="assets/expressao.png" alt="Expressões"></div>
                <div class="card-text">
                    <span class="card-title">Expressões</span>
                    <span class="card-sub">Nhanduereté</span>
                </div>
            </a>

            <a href="#" class="cat-card cultura">
                <div class="card-img"><img src="assets/natureza.png" alt="Cultura"></div>
                <div class="card-text">
                    <span class="card-title">Cultura</span>
                    <span class="card-sub">Tekoa</span>
                </div>
            </a>
        </div>
    </main>

    <!-- Barra de Apoio Fixa na Base -->
    <footer class="apoiadores-bar">
        <div class="apoio-content">
            <span class="apoio-label">APOIO:</span>
            <div class="apoio-item">🏠 ESCOLA KARUGWÁ</div>
            <div class="apoio-item">🐦 ASSOCIAÇÃO CURUCACA</div>
        </div>
    </footer>
</body>
</html>
