<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Karumbé - Detalhes da Instituição</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container" style="padding: 20px; text-align: center; max-width: 800px; margin: 0 auto;">

        <!-- TÍTULO DA INSTITUIÇÃO -->
        <h1 id="titulo-inst" style="color: #5be0ac; margin-bottom: 20px;">Instituição</h1>

        <!-- SEÇÃO DE MISSÃO -->
        <div style="background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: left;">
            <h3 style="color: #5be0ac; margin-bottom: 10px;">🌟 Missão</h3>
            <p id="texto-missao" style="color: #ccc; line-height: 1.5;">Carregando missão...</p>
        </div>

        <!-- SEÇÃO DE AÇÕES E FOTOS DAS AÇÕES -->
        <div style="background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 10px; margin-bottom: 30px; text-align: left;">
            <h3 style="color: #5be0ac; margin-bottom: 10px;">🛠️ Ações Realizadas</h3>
            <p id="texto-acoes" style="color: #ccc; margin-bottom: 20px; line-height: 1.5;">Carregando ações...</p>
            
            <h4 style="color: #fff; margin-bottom: 12px; font-size: 16px;">Fotos das Ações:</h4>
            <div id="galeria-acoes">
                <!-- As fotos específicas das ações entram aqui automaticamente -->
            </div>
        </div>

        <!-- BOTÃO DE VOLTAR -->
        <a href="index.html" style="display: inline-block; background: #112822; color: #5be0ac; border: 1px solid #5be0ac; padding: 10px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 20px;">
            ← Voltar para o Início
        </a>

    </div>

    <script>
        // Pega o ID da URL para saber qual instituição foi clicada
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        const titulo = document.getElementById('titulo-inst');
        const missao = document.getElementById('texto-missao');
        const acoes = document.getElementById('texto-acoes');
        const galeriaAcoes = document.getElementById('galeria-acoes');

        // Banco de dados organizado com missão, ações e fotos exclusivas para as ações
        const instituicoes = {
            "associacao-curucaca": {
                nome: "Associação Curucaca",
                missao: "A Associação Curucaca tem como missão principal fortalecer a cultura, preservar as tradições e garantir os direitos e o bem-estar da comunidade, promovendo o desenvolvimento sustentável e a união entre todos.",
                acoes: "Desenvolvemos projetos voltados para a educação tradicional, oficinas culturais, preservação ambiental do território e apoio às famílias através de iniciativas comunitárias.",
                fotosAcoes: [
                    {
                        url: "assets/logos/associacao-curucaca/fotos/acao1.png",
                        legenda: "Atividades da associação."
                    }
                ]
            },
            "escola-karugwa": {
                nome: "E.E.I. Aldeia Karugwá Pei",
                missao: "Nossa Missão: Raiz, Luta e Futuro na E.E.I. Aldeia Karugwá. Nossa missão nasceu da força coletiva. A história da E.E.I. Aldeia Karugwá — que teve início em 2005 como Escola Ywy Pyhau — não se resume a paredes ou cronogramas, mas ao pulsar de toda uma comunidade unida pelo sonho da emancipação através da educação. Impulsionada pelo trabalho de dois professores formados pela USP através do Magistério Indígena, a escola deu seus primeiros passos em locais improvisados, sustentada unicamente pela coragem, pela esperança e pela participação ativa do nosso povo. Hoje, essa semente plantada com tanto esforço floresceu em um prédio estruturado, transformando a Karugwá em uma referência educacional na região de Itararé, celebrada com orgulho por seus alunos medalhistas e por seu destaque acadêmico. Nossa missão diária é caminhar com firmeza por dois extremos que se completam e se fortalecem: O Rigor e a Conquista: Cumprimos a matriz curricular do Estado com excelência, garantindo que nossos jovens dominem os saberes formais, ocupem espaços e alcancem o topo, provando seu talento através de medalhas e reconhecimento regional. A Essência e a Ancestralidade: Em uníssono, vivemos e respiramos a matriz curricular diversificada, tendo como eixo central a preservação intransigente da língua, da cultura e dos saberes do povo Tupi-Guarani Nhandewa. Nossa missão é ser a ponte entre o passado dos nossos ancestrais e o futuro das nossas crianças, garantindo que caminhar pelos dois mundos seja a maior prova de que nossa identidade é nossa maior força.",
                acoes: "Realização de aulas práticas de campo, resgate de histórias tradicionais com os anciãos, feiras culturais e acompanhamento pedagógico focado na identidade Nhandewa.",
                fotosAcoes: [
                    {
                        url: "assets/logos/escola-karugwa/fotos/primeira escola.png",
                        legenda: "Primeira escola provisória da comunidade em seus primeiros anos."
                    },
                    {
                        url: "assets/logos/escola-karugwa/fotos/acompanhamento pedagogico.png",
                        legenda: "Orientação técnica da matriz curricular, com práticas pedagógicas da E.E.I.Aldeia Karugwá."
                    },
                    {                       
                        url: "assets/logos/escola-karugwa/fotos/apresentacao escola.png",
                        legenda: "Apresentação da Escola."
                    },
                    {
                        url: "assets/logos/escola-karugwa/fotos/segunda escola.png",
                        legenda:"Segunda escola provisória da comunidade alguns anos depois."
                    }
                ]
            },
            "tekoa-karugwa": {
                nome: "Tekoá Karugwá",
                missao: "Manter viva a nossa terra, o nosso modo de ser e a harmonia com o meio ambiente, garantindo a sustentabilidade e a autonomia da comunidade para as futuras gerações.",
                acoes: "Organização de mutirões comunitários, manejo sustentável, festivais de canto e dança tradicional e fortalecimento da espiritualidade.",
                fotosAcoes: [
                    {
                        url: "assets/logos/tekoa-karugwa/fotos/acao1.png",
                        legenda: "Vivência na comunidade."
                    }
                ]
            }
        };

        const dados = instituicoes[id];

        if (dados) {
            titulo.innerText = dados.nome;
            missao.innerText = dados.missao;
            acoes.innerText = dados.acoes;

            // Gera as fotos com suas respectivas legendas automaticamente em cards estruturados
            let htmlGaleria = dados.fotosAcoes.map(item => `
                <div class="card-foto">
                    <img src="${item.url}" alt="Foto da Ação" class="foto-acao">
                    <p>${item.legenda}</p>
                </div>
            `).join('');

// Insere os links úteis apenas se for a página da Escola
            if (id === 'escola-karugwa') {
                htmlGaleria += `
                    <div style="width: 100vw; margin-left: calc(-50vw + 50%); margin-top: 40px; text-align: center !important; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                        <h3 style="color: #5be0ac; margin-bottom: 20px; width: 100%; text-align: center;">🔗 Links Úteis</h3>
                        <div class="botoes-instituicao" style="margin: 0 auto; justify-content: center;">
                            <!-- Botão QEdu -->
                            <div class="item-link">
                                <a href="https://qedu.org.br/escola/35268574-aldeia-karugwa" target="_blank" rel="noopener noreferrer" title="Mais informações no QEdu" class="btn-link-inst">
                                    <img src="assets/links/qedu.png" alt="QEdu">
                                </a>
                                <span style="color: #5be0ac; font-weight: bold; font-size: 14px; margin-top: 8px; display: block;">QEdu</span>
                            </div>

                            <!-- Botão Localização -->
                            <div class="item-link">
                                <a href="https://google.com/maps/place/E.E.I.ALDEIA+KARUGWA+PEI/data=!4m2!3m1!1s0x0:0xf9ed96c96fe6438d?sa=X&ved=1t:2428&ictx=111" target="_blank" rel="noopener noreferrer" title="Localização" class="btn-link-inst">
                                    <img src="assets/links/mapa.png" alt="Localização">
                                </a>
                                <span style="color: #5be0ac; font-weight: bold; font-size: 14px; margin-top: 8px; display: block;">Localização</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            galeriaAcoes.innerHTML = htmlGaleria;
        } else {
            titulo.innerText = "Instituição não encontrada";
            missao.innerText = "";
            acoes.innerText = "";
            galeriaAcoes.innerHTML = "";
        }
    </script>
</body>
</html>
